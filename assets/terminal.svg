  <text x="24" y="178" opacity="0" xml:space="preserve"><tspan class="k">back  </tspan> Node.js · C# / .NET · PostgreSQL · MySQL<set attributeName="opacity" to="1" begin="3.5s" fill="freeze"/></text>
