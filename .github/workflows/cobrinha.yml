name: Cobrinha de contribuições

# Gera a animação da cobrinha comendo o gráfico de contribuições
# e publica os SVGs na branch "output" (usada pelo README do perfil).
on:
  schedule:
    - cron: "0 9,21 * * *" # 06:00 e 18:00 de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0a84ff
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00c6ff

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
